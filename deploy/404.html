<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperPrompt | Page not found</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">

<script>(function(){try{var d=document.documentElement,t=localStorage.getItem('mpz-theme');if(t!=='dark'&&t!=='light'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}d.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>

  .nf h1 { font-size: 1.6rem; margin: 0; }
  .nf p { margin: 0; opacity: .8; }
  .nf a.btn { justify-self: start; display: inline-block; padding: 10px 18px; border-radius: 12px; color: #fff; background: var(--brand-grad, #7c3aed); text-decoration: none; font-weight: 600; }
  .nf .code { font-size: .9rem; opacity: .6; letter-spacing: .08em; }
</style>
</head>
<body>
<main class="nf">

</html>
